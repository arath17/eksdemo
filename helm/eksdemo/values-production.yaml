# Production/demo overrides for eksdemo.
replicaCount: 1

image:
  repository: REPLACE_WITH_ECR_REPO_URL
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: LoadBalancer
  port: 80
  targetPort: 3000
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 50
  targetMemoryUtilizationPercentage: 70

otel:
  serviceName: eksdemo
  exporterEndpoint: "http://opentelemetry-collector.monitoring.svc.cluster.local:4317"

datadog:
  createSecret: false
  site: "datadoghq.com"
