mode: daemonset

# Run on the host network so pods on the same node can reach the collector
# via the node's IP (status.hostIP) and well-known host ports.
hostNetwork: true

image:
  repository: otel/opentelemetry-collector-contrib
  tag: "0.135.0"

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

# Expose OTLP receivers on host ports so application pods can reach the local collector.
ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    hostPort: 4317
    protocol: TCP
  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    hostPort: 4318
    protocol: TCP
  metrics:
    enabled: true
    containerPort: 8888
    servicePort: 8888
    hostPort: 8888
    protocol: TCP

# The k8sattributes processor needs permission to read pods, namespaces and nodes.
clusterRole:
  create: true
  rules:
    - apiGroups: [""]
      resources: ["pods", "namespaces", "nodes"]
      verbs: ["get", "list", "watch"]

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

    hostmetrics:
      collection_interval: 10s
      scrapers:
        paging:
          metrics:
            system.paging.utilization:
              enabled: true
        cpu:
          metrics:
            system.cpu.utilization:
              enabled: true
        disk:
        filesystem:
          metrics:
            system.filesystem.utilization:
              enabled: true
        load:
        memory:
        network:
        processes:

    prometheus:
      config:
        scrape_configs:
          - job_name: 'otelcol'
            scrape_interval: 10s
            static_configs:
              - targets: ['0.0.0.0:8888']

  processors:
    batch:
      timeout: 10s
      send_batch_size: 10
      send_batch_max_size: 100

    resource:
      attributes:
        - key: environment
          value: demo
          action: upsert
        - key: datadog.log.source
          value: node
          action: upsert

    k8sattributes:
      auth_type: serviceAccount
      passthrough: false
      extract:
        metadata:
          - k8s.pod.name
          - k8s.pod.uid
          - k8s.namespace.name
          - k8s.node.name
          - k8s.deployment.name
          - k8s.pod.start_time
      pod_association:
        - sources:
            - from: resource_attribute
              name: k8s.pod.ip
        - sources:
            - from: connection

  connectors:
    datadog/connector:

  exporters:
    datadog/exporter:
      api:
        key: ${env:DD_API_KEY}
        site: ${env:DD_SITE}
      hostname: eksdemo-otelcol
      sending_queue:
        batch:
          min_size: 10
          max_size: 100
          flush_timeout: 10s
      traces:
        span_name_as_resource_name: true

  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [batch, k8sattributes, resource]
        exporters: [datadog/connector, datadog/exporter]
      metrics:
        receivers: [otlp, hostmetrics, prometheus, datadog/connector]
        processors: [batch, k8sattributes, resource]
        exporters: [datadog/exporter]
      logs:
        receivers: [otlp]
        processors: [batch, k8sattributes, resource]
        exporters: [datadog/exporter]

extraEnvs:
  - name: DD_API_KEY
    valueFrom:
      secretKeyRef:
        name: eksdemo-datadog
        key: api-key
        optional: false
  - name: DD_SITE
    valueFrom:
      secretKeyRef:
        name: eksdemo-datadog
        key: site
        optional: false

service:
  type: ClusterIP
