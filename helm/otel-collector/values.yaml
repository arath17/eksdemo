mode: deployment

image:
  repository: otel/opentelemetry-collector-contrib

replicaCount: 1

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  processors:
    batch:
      timeout: 1s
      send_batch_size: 1024
    resource:
      attributes:
        - key: environment
          value: demo
          action: upsert

  exporters:
    datadog:
      api:
        key: ${DD_API_KEY}
        site: datadoghq.com
      traces:
        span_name_as_resource_name: true
      metrics:
        endpoint: https://api.datadoghq.com
      logs:
        endpoint: https://http-intake.logs.datadoghq.com

  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [batch, resource]
        exporters: [datadog]
      metrics:
        receivers: [otlp]
        processors: [batch, resource]
        exporters: [datadog]
      logs:
        receivers: [otlp]
        processors: [batch, resource]
        exporters: [datadog]

extraEnvs:
  - name: DD_API_KEY
    valueFrom:
      secretKeyRef:
        name: eksdemo-datadog
        key: api-key
        optional: false

service:
  type: ClusterIP
