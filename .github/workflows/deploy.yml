name: Deploy

on:
  workflow_run:
    workflows: ["Terraform"]
    types:
      - completed
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  CLUSTER_NAME: ${{ vars.CLUSTER_NAME || 'eksdemo' }}
  HELM_RELEASE: eksdemo
  HELM_NAMESPACE: default
  OTEL_NAMESPACE: monitoring

jobs:
  deploy:
    name: Build and Deploy to EKS
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        working-directory: ./app
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/${{ env.CLUSTER_NAME }}:$IMAGE_TAG .
          docker push $ECR_REGISTRY/${{ env.CLUSTER_NAME }}:$IMAGE_TAG

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.30.0'

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.15.0'

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.CLUSTER_NAME }}

      - name: Create monitoring namespace and Datadog secret
        run: |
          kubectl create namespace ${{ env.OTEL_NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic eksdemo-datadog \
            --namespace ${{ env.OTEL_NAMESPACE }} \
            --from-literal=api-key="${{ secrets.DD_API_KEY }}" \
            --from-literal=site="${{ vars.DD_SITE || 'datadoghq.com' }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Install OpenTelemetry Collector
        run: |
          helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
          helm repo update
          helm upgrade --install opentelemetry-collector open-telemetry/opentelemetry-collector \
            --namespace ${{ env.OTEL_NAMESPACE }} \
            -f ./helm/otel-collector/values.yaml \
            --wait --timeout 5m

      - name: Deploy application with Helm
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          helm upgrade --install ${{ env.HELM_RELEASE }} ./helm/eksdemo \
            --namespace ${{ env.HELM_NAMESPACE }} \
            --set image.repository=$ECR_REGISTRY/${{ env.CLUSTER_NAME }} \
            --set image.tag=$IMAGE_TAG \
            --wait --timeout 5m

      - name: Verify deployment
        run: |
          kubectl get pods -n ${{ env.HELM_NAMESPACE }}
          kubectl get svc -n ${{ env.HELM_NAMESPACE }}
          kubectl get hpa -n ${{ env.HELM_NAMESPACE }}
